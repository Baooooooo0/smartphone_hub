name: smartphonehub
description: "SmartphoneHub — Ứng dụng thương mại điện tử bán điện thoại thông minh. CV/Portfolio project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ─── Firebase ───────────────────────────────────────────
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3
  firebase_analytics: ^12.4.5
  firebase_crashlytics: ^5.2.6
  firebase_remote_config: ^6.5.5
  cloud_functions: ^6.3.5

  # ─── State Management ───────────────────────────────────
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # ─── Navigation ─────────────────────────────────────────
  go_router: ^17.3.0

  # ─── Models (code gen) ──────────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # ─── UI Components ──────────────────────────────────────
  cached_network_image: ^3.4.1
  flutter_svg: ^2.1.0
  shimmer: ^3.0.0
  fl_chart: ^1.2.0
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^2.0.1
  lottie: ^3.3.1
  animate_do: ^5.1.0
  flutter_rating_bar: ^4.0.1

  # ─── Utilities ──────────────────────────────────────────
  intl: ^0.20.2
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^22.2.0
  connectivity_plus: ^7.3.1
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  qr_flutter: ^4.1.0

  # ─── Google Fonts ────────────────────────────────────────
  google_fonts: ^8.2.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ─── Code Generation ─────────────────────────────────────
  build_runner: ^2.4.15
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.9.4
  riverpod_generator: ^4.0.4

  # ─── Testing ─────────────────────────────────────────────
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/fonts/
